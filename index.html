<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>The Binding of dodo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- 「添加到主屏幕」后按全屏应用启动，甩掉 Safari 的地址栏和标签栏 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0806">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="576"></canvas>
  <div id="touch-ui" class="hidden">
    <div id="top-pad">
      <!-- 图标内联成 SVG：零素材文件，也不受手机字体回退影响 -->
      <button id="btn-pause" class="corner-btn" aria-label="暂停 / 继续">
        <svg class="i-pause" viewBox="0 0 24 24"><rect x="7" y="4.5" width="3.6" height="15" rx="1.2"/><rect x="13.4" y="4.5" width="3.6" height="15" rx="1.2"/></svg>
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7.5 4.4 19 12 7.5 19.6z"/></svg>
      </button>
      <button id="btn-codex" class="corner-btn" aria-label="解锁图鉴">
        <svg viewBox="0 0 24 24"><path d="M11.1 5.9C9 4.5 6.4 4.1 3.9 4.7v13.1c2.4-.5 4.9-.1 7.2 1.2zM12.9 5.9C15 4.5 17.6 4.1 20.1 4.7v13.1c-2.4-.5-4.9-.1-7.2 1.2z"/></svg>
      </button>
    </div>
    <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
    <div id="fire-pad">
      <!-- 箭头用 CSS 画：◀ ▶ 这类码位在手机上会被 emoji 字体接走，变成蓝色方块 -->
      <button class="fire-btn" data-dir="up" aria-label="向上射击"></button>
      <button class="fire-btn" data-dir="left" aria-label="向左射击"></button>
      <button class="fire-btn" data-dir="right" aria-label="向右射击"></button>
      <button class="fire-btn" data-dir="down" aria-label="向下射击"></button>
    </div>
    <div id="action-pad">
      <button id="btn-item" class="action-btn">道具</button>
      <button id="btn-bomb" class="action-btn">炸弹</button>
    </div>
  </div>
  <div id="rotate-hint">
    <div id="rotate-phone"></div>
    <p>请将手机横过来游玩</p>
  </div>
</div>
<script src="js/utils.js"></script>
<script src="js/meta.js"></script>
<script src="js/char-powers.js"></script>
<script src="js/audio.js"></script>
<script src="js/sprites-room.js"></script>
<script src="js/sprites-actors.js"></script>
<script src="js/sprites-items.js"></script>
<script src="js/sprites-fx.js"></script>
<script src="js/items.js"></script>
<script src="js/dungeon.js"></script>
<script src="js/entities-player.js"></script>
<script src="js/entities-enemies.js"></script>
<script src="js/boss-core.js"></script>
<script src="js/boss-attacks.js"></script>
<script src="js/boss-attacks-signature.js"></script>
<script src="js/boss-render.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/menu-unlocks.js"></script>
<script src="js/game-core.js"></script>
<script src="js/game-flow.js"></script>
<script src="js/game-update.js"></script>
<script src="js/game-render.js"></script>
<script src="js/game-screens.js"></script>
</body>
</html>
